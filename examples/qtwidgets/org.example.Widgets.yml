app-id: org.example.Widgets
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: widgets-demo
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: widgets-demo
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release]
    sources:
      - type: dir
        path: .
        skip: [.wingsetup, dist, __pycache__]
