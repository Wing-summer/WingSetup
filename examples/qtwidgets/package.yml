schema_version: 1
application:
  id: org.example.Widgets
  name: WidgetsDemo
  version: '0.1.0'
  summary: Qt Widgets resource and plugin deployment verification
  license: BSD-3-Clause
  executable: '{build}/widgets-demo'
  desktop: org.example.Widgets.desktop
  icon: org.example.Widgets.svg
installation:
  publisher: WingSetup example
  homepage: https://example.org/widgets
  support_url: https://example.org/widgets/support
  license_file: ../../LICENSE
  icons:
    linux: org.example.Widgets.svg
    windows: assets/icons/app.ico
    macos: assets/icons/app.icns
  scope: user
  shortcuts:
    start_menu: true
    desktop: true
  launch_after_install: true
  add_to_path: true
  autostart: true
  file_types:
    - id: demo
      description: WingSetup demonstration document
      extensions: [.wingsetup-demo]
      mime_type: application/x-wingsetup-demo
      icons:
        linux: org.example.Widgets.svg
        windows: assets/icons/app.ico
        macos: assets/icons/app.icns
    - id: obsolete
      description: WingSetup upgrade cleanup fixture
      extensions: [.wingsetup-obsolete]
      mime_type: application/x-wingsetup-obsolete
  protocols:
    - scheme: wingsetup-demo
      description: WingSetup demonstration URL
    - scheme: wingsetup-obsolete
      description: WingSetup upgrade cleanup URL
  context_menu:
    - id: open
      label: Open with WidgetsDemo
      targets: [file, directory, background]
project:
  source: .
  hooks: hooks.py:WidgetsHooks
  commands:
    - [cmake, -G, Ninja, -S, '{source}', -B, '{build}', -DCMAKE_BUILD_TYPE=Release]
    - [cmake, --build, '{build}', --parallel, '2']
workspace: .wingsetup
output: dist
targets:
  appimage:
    backend: appimage
    arch: x86_64
    options:
      plugins: [qt]
      qt_platforms: [xcb, wayland, offscreen]
      environment:
        QMAKE: qmake6
        NO_STRIP: '1'
        EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
      dependency_dirs: [usr/bin/plugin]
  flatpak-sdk:
    backend: flatpak
    arch: x86_64
    options:
      mode: sdk
      runtime: org.kde.Platform
      sdk: org.kde.Sdk
      runtime_version: '6.10'
      installation: system
      manifest: org.example.Widgets.yml
  windows:
    backend: inno
    platform: Windows
    arch: x86_64
    executable: '{build}/widgets-demo.exe'
    options:
      formats: [zip, inno]
      default_dir: '{localappdata}\Programs\WidgetsDemo'
      privileges: lowest
      setup:
        AppPublisher: WingSetup example
        WizardStyle: modern
        UsePreviousAppDir: 'yes'
      file_excludes: ['*.pdb']
      qt_args: [--release, --include-plugins, "qwindows,qoffscreen"]
  macos:
    backend: macos
    platform: Darwin
    arch: aarch64
    executable: '{build}/widgets-demo.app'
    options:
      formats: [app, zip, dmg]
      extra_executables:
        - Contents/PlugIns/demo_plugin.wingplg
        - Contents/PlugIns/platforms/libqoffscreen.dylib
  macos-intel:
    backend: macos
    platform: Darwin
    arch: x86_64
    executable: '{build}/widgets-demo.app'
    options:
      formats: [app, zip, dmg]
      extra_executables:
        - Contents/PlugIns/demo_plugin.wingplg
        - Contents/PlugIns/platforms/libqoffscreen.dylib
  rpm:
    backend: rpm
    arch: x86_64
    options:
      package_name: wingsetup-qt
      depends: [qt6-qtbase, qt6-qtsvg]
  arch:
    backend: arch
    arch: x86_64
    options:
      package_name: wingsetup-qt
      depends: [qt6-base, qt6-svg]
  rpm-arm64:
    backend: rpm
    arch: aarch64
    options:
      package_name: wingsetup-qt
      depends: [qt6-qtbase, qt6-qtsvg]
  rpm-riscv64:
    backend: rpm
    arch: riscv64
    options:
      package_name: wingsetup-qt
      depends: [qt6-qtbase, qt6-qtsvg]
