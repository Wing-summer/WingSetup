schema_version: 1
application:
  id: org.example.Hello
  name: Hello
  version: '0.1.0'
  summary: Extended backend demonstration
  license: BSD-3-Clause
  executable: build/hello
  desktop: org.example.Hello.desktop
  icon: org.example.Hello.svg
project:
  source: .
  hooks: hooks.py:HelloHooks
  commands:
    - [cc, hello.c, -o, '{source}/build/hello']
workspace: .wingsetup
output: dist
targets:
  deb:
    backend: deb
    arch: x86_64
    options:
      package_name: wingsetup-hello
      maintainer: wingsummer
      depends: [libc6]
  aur-release:
    backend: aur
    arch: any
    options:
      recipe: recipes/aur-release
  aur-git:
    backend: aur
    arch: any
    options:
      recipe: recipes/aur-git
  scripts:
    backend: script
    arch: any
    options:
      recipe: recipes/scripts
      entry: installer.py
  shell:
    backend: makeself
    arch: x86_64
    options:
      payload: build
      startup: recipes/scripts/install.sh
  shell-sh:
    backend: makeself
    arch: x86_64
    options:
      payload: build
      startup: recipes/scripts/install.sh
      suffix: sh
  archive:
    backend: custom_backend.py:ArchiveBackend
    arch: x86_64
    resources:
      - source: hello.c
        destination: source/hello.c
  rpm:
    backend: rpm
    arch: x86_64
    options:
      package_name: wingsetup-basic
  arch:
    backend: arch
    arch: x86_64
    options:
      package_name: wingsetup-basic
  rpm-arm64:
    backend: rpm
    arch: aarch64
    options:
      package_name: wingsetup-basic
  rpm-riscv64:
    backend: rpm
    arch: riscv64
    options:
      package_name: wingsetup-basic
  deb-arm64:
    backend: deb
    arch: aarch64
    options:
      package_name: wingsetup-basic
      maintainer: wingsummer
  deb-riscv64:
    backend: deb
    arch: riscv64
    options:
      package_name: wingsetup-basic
      maintainer: wingsummer
  portable:
    backend: archive
    arch: x86_64
