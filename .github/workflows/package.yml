name: Reusable application packages
on:
  workflow_call:
    inputs:
      repository:
        description: Application repository; defaults to the caller repository
        type: string
        default: ''
      ref:
        description: Application commit or tag; defaults to the triggering commit
        type: string
        default: ''
      build-config:
        description: Repository-relative release build YAML
        type: string
        default: mkinstaller/build.yml
      builds:
        description: all or comma-separated build IDs
        type: string
        default: all
      mode:
        description: qt or plain; qt enables Qt setup and preparation for every selected build
        type: string
        default: qt
      artifact-prefix:
        description: Unique prefix when invoking this workflow more than once in a run
        type: string
        default: wingsetup
      framework-ref:
        description: WingSetup commit or tag; pin this alongside the reusable workflow
        type: string
        default: main
    outputs:
      artifact-name:
        description: Download this workflow artifact to obtain release files
        value: ${{ jobs.collect.outputs.artifact-name }}
      assets:
        description: JSON array with file names, SHA-256 values, formats and architectures
        value: ${{ jobs.collect.outputs.assets }}
      files:
        description: Newline-separated release file names
        value: ${{ jobs.collect.outputs.files }}
      checksums:
        description: SHA256SUMS.txt contents
        value: ${{ jobs.collect.outputs.checksums }}
permissions:
  contents: read
jobs:
  plan:
    name: Validate project build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      source-ref: ${{ steps.plan.outputs.source-ref }}
    steps:
      - name: Check out WingSetup
        uses: actions/checkout@v7
        with:
          repository: Wing-summer/WingSetup
          ref: ${{ inputs.framework-ref }}
          path: framework
          persist-credentials: false
      - name: Check out application
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref || (inputs.repository == '' && github.sha || '') }}
          path: application
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install framework environment
        shell: bash
        run: python framework/ci/environment.py
      - name: Validate and select all requested builds
        id: plan
        shell: bash
        env:
          BUILD_CONFIG: ${{ inputs.build-config }}
          BUILDS: ${{ inputs.builds }}
          MODE: ${{ inputs.mode }}
        run: >-
          "$WINGSETUP_PYTHON" framework/ci/release.py plan
          --root application --file "application/$BUILD_CONFIG" --builds "$BUILDS" --mode "$MODE"
  build:
    name: Package / ${{ matrix.id }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out WingSetup
        uses: actions/checkout@v7
        with:
          repository: Wing-summer/WingSetup
          ref: ${{ inputs.framework-ref }}
          path: framework
          persist-credentials: false
      - name: Check out application and submodules
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ needs.plan.outputs.source-ref }}
          path: application
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Set up project Qt SDK
        if: inputs.mode == 'qt' && matrix.qt_version != '' && matrix.system == 'native'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          modules: ${{ matrix.qt_modules }}
          cache: true
      - name: Install framework environment
        if: matrix.system == 'native'
        shell: bash
        run: python framework/ci/environment.py
      - name: Prepare, build, deploy and package
        if: matrix.system == 'native'
        shell: bash
        env:
          BUILD_CONFIG: ${{ inputs.build-config }}
          BUILD_ID: ${{ matrix.id }}
          MODE: ${{ inputs.mode }}
        run: >-
          "$WINGSETUP_PYTHON" framework/ci/release.py build
          --root application --file "application/$BUILD_CONFIG"
          --builds "$BUILD_ID" --mode "$MODE"
          --destination "job-assets/$BUILD_ID"
      - name: Build inside QEMU riscv64 and copy assets back
        if: matrix.system == 'riscv64'
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: none
          distro: none
          base_image: --platform=linux/riscv64 riscv64/ubuntu:26.04
          env: ${{ toJSON(matrix.environment) }}
          install: |
            apt-get update
            apt-get install -y python3 python3-venv python3-pip build-essential
          run: |
            python3 framework/ci/environment.py
            framework/.venv-ci/bin/python framework/ci/release.py build --root application --file "application/$BUILD_CONFIG" --builds "$BUILD_ID" --mode "$MODE" --destination "job-assets/$BUILD_ID"
      - name: Build inside FreeBSD VM and copy assets back
        if: matrix.system == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        env:
          BUILD_CONFIG: ${{ inputs.build-config }}
          BUILD_ID: ${{ matrix.id }}
          MODE: ${{ inputs.mode }}
        with:
          release: '14.3'
          arch: x86_64
          envs: BUILD_CONFIG BUILD_ID MODE
          usesh: true
          prepare: pkg install -y python311 py311-pip
          run: |
            python3.11 framework/ci/environment.py
            framework/.venv-ci/bin/python framework/ci/release.py build --root application --file "application/$BUILD_CONFIG" --builds "$BUILD_ID" --mode "$MODE" --destination "job-assets/$BUILD_ID"
      - name: Preserve successful build assets and receipt
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-job-${{ matrix.id }}
          path: job-assets/${{ matrix.id }}/
          if-no-files-found: error
      - name: Preserve failed packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-failure-${{ matrix.id }}
          path: |
            application/**/.wingsetup/**/commands.log
            application/**/.wingsetup/**/progress.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
  collect:
    name: Verify and assemble all release assets
    needs: [plan, build]
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ inputs.artifact-prefix }}-release
      assets: ${{ steps.collect.outputs.assets }}
      files: ${{ steps.collect.outputs.files }}
      checksums: ${{ steps.collect.outputs.checksums }}
    steps:
      - name: Check out WingSetup
        uses: actions/checkout@v7
        with:
          repository: Wing-summer/WingSetup
          ref: ${{ inputs.framework-ref }}
          path: framework
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install framework environment
        shell: bash
        run: python framework/ci/environment.py
      - name: Download every build receipt and asset
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-job-*
          path: downloaded-assets
      - name: Verify completeness, unique file names and SHA-256
        id: collect
        shell: bash
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: >-
          "$WINGSETUP_PYTHON" framework/ci/release.py collect
          --expected "$EXPECTED" --inputs downloaded-assets --destination release-assets
      - name: Upload files ready for a separate release job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-prefix }}-release
          path: release-assets/
          if-no-files-found: error
